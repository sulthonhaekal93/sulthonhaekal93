<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sedjati Numeracy Adventure</title>
<meta name="description" content="Game numerasi Taman Belajar Sedjati: belajar penjumlahan, pengurangan, perkalian, dan pembagian untuk anak TK dan SD.">
<meta name="theme-color" content="#15803D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2315803D'/%3E%3Cpath d='M32 50V30' stroke='%23FFF8E7' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 32c0-9 7-15 16-15 0 9-7 15-16 15z' fill='%23FACC15'/%3E%3Cpath d='M32 36c0-8-6-13-14-13 0 8 6 13 14 13z' fill='%23FB923C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Lewati ke isi utama</a>

<header class="topbar">
  <button class="brand" type="button" data-go="home" aria-label="Beranda Sedjati Numeracy Adventure">
    <svg viewBox="0 0 64 64" aria-hidden="true" class="brand-mark">
      <rect width="64" height="64" rx="16" fill="#15803D"/>
      <path d="M32 50V30" stroke="#FFF8E7" stroke-width="5" stroke-linecap="round"/>
      <path d="M32 32c0-9 7-15 16-15 0 9-7 15-16 15z" fill="#FACC15"/>
      <path d="M32 36c0-8-6-13-14-13 0 8 6 13 14 13z" fill="#FB923C"/>
    </svg>
    <span class="brand-text"><b>Sedjati</b><small>Numeracy Adventure</small></span>
  </button>
  <button class="player-chip" id="playerChip" type="button" hidden aria-label="Lihat progres belajar">
    <span class="pc-name" id="chipName"></span>
    <span class="pc-stars"><span aria-hidden="true">⭐</span> <b id="chipStars">0</b><span class="sr-only"> bintang</span></span>
  </button>
  <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Suara aktif">
    <span aria-hidden="true" id="soundIcon">🔊</span>
  </button>
</header>

<div class="notice" id="storageNote" role="status" hidden></div>

<main id="main" tabindex="-1">

  <!-- ============ BERANDA ============ -->
  <section class="screen" id="screen-home" aria-labelledby="homeTitle">
    <div class="hero">
      <div class="hero-text">
        <p class="eyebrow">Taman Belajar Sedjati</p>
        <h1 id="homeTitle" class="hero-title">Sedjati <span>Numeracy</span> Adventure</h1>
        <p class="tagline">Belajar, Bermain, Berhitung!</p>
        <p class="intro">Yuk, bertualang di dunia angka! Selesaikan misi, pecahkan soal, dan jadilah <b>Jago Numerasi Sedjati!</b></p>
        <p class="welcome-back" id="welcomeBack" hidden></p>
      </div>
      <figure class="hero-art">
        <svg viewBox="0 0 360 270" role="img" aria-labelledby="heroArtTitle">
          <title id="heroArtTitle">Seorang anak menjelajahi kebun angka dengan pohon berbuah angka</title>
          <rect width="360" height="270" rx="28" fill="#E0F2FE"/>
          <circle cx="300" cy="56" r="30" fill="#FACC15"/>
          <g fill="#FFFFFF" opacity=".9">
            <ellipse cx="80" cy="50" rx="34" ry="13"/><ellipse cx="104" cy="42" rx="22" ry="13"/>
            <ellipse cx="220" cy="34" rx="26" ry="10"/>
          </g>
          <!-- Bukit -->
          <path d="M0 170 Q90 120 180 160 T360 150 V270 H0Z" fill="#86C99A"/>
          <path d="M0 205 Q120 165 230 200 T360 196 V270 H0Z" fill="#15803D"/>
          <!-- Jalan setapak -->
          <path d="M150 270 Q170 230 210 214 T262 196" fill="none" stroke="#FFF8E7" stroke-width="16" stroke-linecap="round"/>
          <!-- Pohon angka kiri -->
          <rect x="54" y="118" width="12" height="52" rx="5" fill="#8B5E34"/>
          <circle cx="60" cy="104" r="36" fill="#1F9D4D"/>
          <g font-family="Fredoka, sans-serif" font-weight="700" font-size="16" text-anchor="middle">
            <circle cx="44" cy="96" r="12" fill="#FB923C"/><text x="44" y="102" fill="#FFF">1</text>
            <circle cx="74" cy="88" r="12" fill="#FACC15"/><text x="74" y="94" fill="#7C4A03">2</text>
            <circle cx="62" cy="118" r="12" fill="#FB923C"/><text x="62" y="124" fill="#FFF">3</text>
          </g>
          <!-- Pohon angka kanan -->
          <rect x="296" y="128" width="10" height="44" rx="4" fill="#8B5E34"/>
          <circle cx="301" cy="116" r="28" fill="#1F9D4D"/>
          <g font-family="Fredoka, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
            <circle cx="290" cy="110" r="10" fill="#FACC15"/><text x="290" y="115" fill="#7C4A03">5</text>
            <circle cx="313" cy="124" r="10" fill="#FB923C"/><text x="313" y="129" fill="#FFF">8</text>
          </g>
          <!-- Papan petunjuk -->
          <rect x="236" y="168" width="6" height="34" fill="#8B5E34"/>
          <rect x="204" y="152" width="70" height="24" rx="6" fill="#FFF8E7" stroke="#8B5E34" stroke-width="3"/>
          <text x="239" y="169" font-family="Fredoka, sans-serif" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Kebun Angka</text>
          <!-- Bunga -->
          <g>
            <circle cx="110" cy="232" r="6" fill="#FACC15"/><circle cx="102" cy="232" r="5" fill="#FFF"/><circle cx="118" cy="232" r="5" fill="#FFF"/><circle cx="110" cy="224" r="5" fill="#FFF"/><circle cx="110" cy="240" r="5" fill="#FFF"/>
            <circle cx="320" cy="236" r="5" fill="#FB923C"/><circle cx="313" cy="236" r="4" fill="#FFF"/><circle cx="327" cy="236" r="4" fill="#FFF"/><circle cx="320" cy="229" r="4" fill="#FFF"/><circle cx="320" cy="243" r="4" fill="#FFF"/>
          </g>
          <!-- Anak -->
          <g transform="translate(160 132)">
            <rect x="-5" y="76" width="10" height="26" rx="5" fill="#334155" transform="rotate(8)"/>
            <rect x="9" y="76" width="10" height="26" rx="5" fill="#334155" transform="rotate(-8 14 76)"/>
            <path d="M-12 40 Q2 30 26 40 L30 82 H-16Z" fill="#FB923C"/>
            <rect x="-24" y="42" width="12" height="34" rx="6" fill="#16A34A"/>
            <path d="M24 46 Q44 34 50 18" stroke="#F2C095" stroke-width="9" stroke-linecap="round" fill="none"/>
            <path d="M-10 48 Q-22 62 -16 78" stroke="#F2C095" stroke-width="9" stroke-linecap="round" fill="none"/>
            <circle cx="7" cy="18" r="21" fill="#F2C095"/>
            <path d="M-14 14 Q-12 -6 8 -4 Q28 -4 28 14 Q20 4 6 6 Q-6 6 -14 14Z" fill="#3B2314"/>
            <circle cx="0" cy="19" r="2.6" fill="#1E293B"/><circle cx="15" cy="19" r="2.6" fill="#1E293B"/>
            <path d="M1 27 Q8 33 15 27" stroke="#1E293B" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <circle cx="-4" cy="25" r="3" fill="#FCA5A5" opacity=".7"/><circle cx="20" cy="25" r="3" fill="#FCA5A5" opacity=".7"/>
          </g>
          <!-- Simbol mengambang -->
          <g font-family="Fredoka, sans-serif" font-weight="700" text-anchor="middle">
            <circle cx="214" cy="96" r="17" fill="#FFFFFF"/><text x="214" y="104" font-size="22" fill="#15803D">+</text>
            <circle cx="252" cy="118" r="14" fill="#FFFFFF"/><text x="252" y="125" font-size="18" fill="#FB923C">×</text>
            <circle cx="140" cy="84" r="14" fill="#FFFFFF"/><text x="140" y="91" font-size="18" fill="#0284C7">÷</text>
            <circle cx="114" cy="140" r="12" fill="#FFFFFF"/><text x="114" y="146" font-size="16" fill="#CA8A04">−</text>
          </g>
        </svg>
      </figure>
    </div>
    <div class="home-actions">
      <button class="btn btn-primary btn-xl" type="button" data-action="start">Mulai Petualangan <span aria-hidden="true">🚀</span></button>
      <div class="home-grid">
        <button class="btn btn-tile" type="button" data-action="levels"><span class="tile-ic" aria-hidden="true">🗺️</span>Pilih Level</button>
        <button class="btn btn-tile" type="button" data-action="progress"><span class="tile-ic" aria-hidden="true">📈</span>Progres Belajar</button>
        <button class="btn btn-tile" type="button" data-action="guide"><span class="tile-ic" aria-hidden="true">👨‍👩‍👧</span>Panduan Orang Tua &amp; Guru</button>
      </div>
    </div>
  </section>

  <!-- Layar lain diisi oleh js/app.js -->
  <section class="screen" id="screen-profile" hidden></section>
  <section class="screen" id="screen-map" hidden></section>
  <section class="screen" id="screen-area" hidden></section>
  <section class="screen" id="screen-intro" hidden></section>
  <section class="screen" id="screen-play" hidden></section>
  <section class="screen" id="screen-summary" hidden></section>
  <section class="screen" id="screen-progress" hidden></section>
  <section class="screen" id="screen-guide" hidden></section>
</main>

<footer class="foot">
  <p>© Taman Belajar Sedjati · Tanpa iklan · Ramah anak</p>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalText">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" type="button" id="modalCancel">Batal</button>
      <button class="btn btn-primary" type="button" id="modalOk">Ya</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="noscript">Permainan ini membutuhkan JavaScript. Aktifkan JavaScript di browser untuk bermain.</p></noscript>

<script src="config.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/generator.js"></script>
<script src="js/progress.js"></script>
<script src="js/sheet.js"></script>
<script src="js/visuals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
